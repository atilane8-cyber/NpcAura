
plugins {
    id 'net.fabricmc.fabric-loom' version '1.11-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'
group = 'example.npcaura'

base {
    archivesName = 'npcaura'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.10'
    mappings 'net.fabricmc:yarn:1.21.10+build.2:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.17.2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.138.3+1.21.10'
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
